  <!-- =================================================
       EVENTOS GA4
  ================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        const instituto =
          document.getElementById(
            "link-instituto"
          );


        const avaliacao =
          document.getElementById(
            "link-avaliacao"
          );


        const site =
          document.getElementById(
            "link-site"
          );


        if (instituto) {

          instituto.addEventListener(
            "click",
            function () {

              gtag(
                "event",
                "click_instituto",
                {

                  event_category:
                    "link_bio",

                  event_label:
                    "Instituto Bulhões",

                  destination:
                    "whatsapp_instituto"

                }
              );

            }
          );

        }


        if (avaliacao) {

          avaliacao.addEventListener(
            "click",
            function () {

              gtag(
                "event",
                "click_avaliacao",
                {

                  event_category:
                    "link_bio",

                  event_label:
                    "Agendar avaliação",

                  destination:
                    "whatsapp_clinica"

                }
              );

            }
          );

        }


        if (site) {

          site.addEventListener(
            "click",
            function () {

              gtag(
                "event",
                "click_site",
                {

                  event_category:
                    "link_bio",

                  event_label:
                    "Site Bulhões",

                  destination:
                    "site_bulhoes"

                }
              );

            }
          );

        }

      }
    );
