<body>

      <h1>

      <p class="hero-subtitle">
        ODONTOLOGIA • EDUCAÇÃO • GESTÃO
      </p>

    </div>


    <a
      href="#links"
      class="links-label"
      id="link-scroll"

      <strong>
        LINKS IMPORTANTES
      </strong>

      <span>↓</span>

  <!-- LINKS -->

  <main

    id="links"
  >

      <!-- INSTITUTO -->

      <a
        class="visual-card card-instituto"
        id="link-instituto"
        href="https://wa.me/551340427082"

      >

          <img
            src="instituto.JPG"
            alt="Instituto Bulhões"
            class="instituto-photo"

        </div>

          class="visual-overlay instituto-overlay"
        ></div>


        <div
          class="visual-content visual-content-right"
        >

          <span class="visual-eyebrow">
            INSTITUTO BULHÕES
          </span>

            CONHEÇA<br>
            NOSSOS CURSOS
          </h2>

          <div class="visual-line"></div>

        </div>

      </a>



      <!-- AVALIAÇÃO -->

      <a
        class="visual-card card-avaliacao"
        id="link-avaliacao"
        href="https://wa.me/5513996300176"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          src="avaliacao.JPG"
          alt="Agende sua avaliação"
        >

        <div
          class="visual-overlay overlay-left"
        ></div>


        <div
          class="visual-content visual-content-left"
        >

          <span class="visual-eyebrow">
            BULHÕES ODONTOLOGIA

            AGENDE SUA<br>
            AVALIAÇÃO
          </h2>

          <div class="visual-line"></div>

        </div>

      </a>



      <!-- SITE -->

      <a
        class="visual-card card-site"
        id="link-site"
        href="https://www.bulhoesodontologia.com.br/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          src="site.jpg"
          alt="Visite nosso site"
        >

        <div
          class="visual-overlay overlay-right"
        ></div>


        <div
          class="visual-content visual-content-right"
        >

          <span class="visual-eyebrow">
            BULHÕES ODONTOLOGIA

            SITE
