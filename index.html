  </main>


  <!-- PERSISTÊNCIA DAS UTMS -->

  <script>

    (function () {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const trackingParams = [
        "utm_source",
        "utm_medium",
        "utm_campaign",
        "utm_content",
        "utm_term",
        "fbclid",
        "gclid"
      ];


      trackingParams.forEach(
        function (param) {

          const value =
            params.get(param);


          if (value) {

            localStorage.setItem(
              param,
              value
            );

          }

        }
      );


      if (
        !localStorage.getItem(
          "landing_page"
        )
      ) {

        localStorage.setItem(
          "landing_page",
          window.location.href
        );

      }


      if (
        !localStorage.getItem(
          "first_referrer"
        )
      ) {

        localStorage.setItem(
          "first_referrer",
          document.referrer || "direct"
        );

      }


      function getTrackingData() {

        return {

          utm_source:
            localStorage.getItem(
              "utm_source"
            ) || "direct",

          utm_medium:
            localStorage.getItem(
              "utm_medium"
            ) || "none",

          utm_campaign:
            localStorage.getItem(
              "utm_campaign"
            ) || "none",

          utm_content:
            localStorage.getItem(
              "utm_content"
            ) || "none",

          utm_term:
            localStorage.getItem(
              "utm_term"
            ) || "none",

          fbclid:
            localStorage.getItem(
              "fbclid"
            ) || "",

          gclid:
            localStorage.getItem(
              "gclid"
            ) || "",

          landing_page:
            localStorage.getItem(
              "landing_page"
            ) || "",

          first_referrer:
            localStorage.getItem(
              "first_referrer"
            ) || ""

        };

      }


      window.getLeadTrackingData =
        getTrackingData;


      window.trackLeadClick =
        function (destination) {

          const tracking =
            getTrackingData();


          if (
            typeof gtag ===
            "function"
          ) {

            gtag(
              "event",
              "lead_click",
              {

                destination:
                  destination,

                utm_source:
                  tracking.utm_source,

                utm_medium:
                  tracking.utm_medium,

                utm_campaign:
                  tracking.utm_campaign,

                utm_content:
                  tracking.utm_content,

                utm_term:
                  tracking.utm_term,

                landing_page:
                  tracking.landing_page,

                first_referrer:
                  tracking.first_referrer

              }
            );

          }

        };

    })();

  </script>


  <script src="script.js"></script>
