<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

    <div class="links-wrapper">


      <!-- INSTITUTO BULHÕES -->

      <a

        <div class="visual-content visual-content-right">

          <span class="visual-eyebrow">

        href="https://wa.me/5513996300176?text=Ol%C3%A1%21%20Vim%20pelo%20Instagram%20da%20Dra.%20Larissa%20e%20gostaria%20de%20agendar%20uma%20avalia%C3%A7%C3%A3o%20na%20Bulh%C3%B5es%20Odontologia."

        <div class="visual-overlay overlay-left"></div>

        <div class="visual-content visual-content-left">

          <span class="visual-eyebrow">
            BULHÕES ODONTOLOGIA
          </span>

          <h2>
            AGENDE SUA<br>
            AVALIAÇÃO
          </h2>

          <div class="visual-line"></div>

        </div>

      <!-- SITE -->

      <a
        class="visual-card"
        href="https://www.bulhoesodontologia.com.br/"
        target="_blank"
        rel="noopener noreferrer"

        <img
          src="site.jpg"
          alt="Site da Bulhões Odontologia"
        >

        <div class="visual-overlay overlay-right"></div>

        <div class="visual-content visual-content-right">

          <span class="visual-eyebrow">
            BULHÕES ODONTOLOGIA
