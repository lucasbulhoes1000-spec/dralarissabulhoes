<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Instituto Bulhões | Dra. Larissa Bulhões</title>


  <!-- GOOGLE ANALYTICS -->

  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-Y4WBS26X61"
  ></script>

  <script>

    window.dataLayer =
      window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag(
      "js",
      new Date()
    );

    gtag(
      "config",
      "G-Y4WBS26X61"
    );

  </script>

</head>


<body style="
  margin: 0;
  background: #120E0C;
  color: #FFFFFF;
">

  <div
    style="
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    "
  >

    <p>
      Abrindo o WhatsApp...
    </p>

  </div>


  <script>

    (function () {

      /* ==========================================
         CONFIGURAÇÕES
      ========================================== */

      const WHATSAPP =
        "551340427082";


      const CLICK_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbx-2IhvdBZH2JfLGU-mSVIyub2KHbOrGukal-diPqxm0wa7YF2Uljk4HytL4wDNISf-/exec";


      /* ==========================================
         CAPTURAR UTMS
      ========================================== */

      const params =
        new URLSearchParams(
          window.location.search
        );


      const tracking = {

        utm_source:
          params.get("utm_source") ||
          "direct",

        utm_medium:
          params.get("utm_medium") ||
          "none",

        utm_campaign:
          params.get("utm_campaign") ||
          "none",

        utm_content:
          params.get("utm_content") ||
          "none",

        utm_term:
          params.get("utm_term") ||
          "none",

        fbclid:
          params.get("fbclid") || "",

        gclid:
          params.get("gclid") || ""

      };


      /* ==========================================
         CLICK ID
      ========================================== */

      function generateClickId() {

        const timestamp =
          Date.now()
            .toString(36)
            .toUpperCase();


        const random =
          Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


        return (
          "LARI-" +
          timestamp +
          "-" +
          random
        );

      }


      const clickId =
        generateClickId();


      /* ==========================================
         CRIAR REGISTRO
      ========================================== */

      const record = {

        click_id:
          clickId,

        data_hora:
          new Date().toISOString(),

        destino:
          "whatsapp_instituto",

        utm_source:
          tracking.utm_source,

        utm_medium:
          tracking.utm_medium,

        utm_campaign:
          tracking.utm_campaign,

        utm_content:
          tracking.utm_content,

        utm_term:
          tracking.utm_term,

        pagina:
          window.location.href

      };


      /* ==========================================
         SALVAR LOCALMENTE
      ========================================== */

      try {

        localStorage.setItem(
          "last_lead_click",
          JSON.stringify(record)
        );

      }

      catch (error) {}


      /* ==========================================
         ENVIAR PARA GOOGLE SHEETS
      ========================================== */

      function sendToSheets() {

        const payload =
          JSON.stringify(record);


        try {

          if (navigator.sendBeacon) {

            const blob =
              new Blob(
                [payload],
                {
                  type:
                    "text/plain;charset=UTF-8"
                }
              );


            navigator.sendBeacon(
              CLICK_ENDPOINT,
              blob
            );


            return;

          }


          fetch(
            CLICK_ENDPOINT,
            {

              method:
                "POST",

              mode:
                "no-cors",

              keepalive:
                true,

              headers: {

                "Content-Type":
                  "text/plain;charset=UTF-8"

              },

              body:
                payload

            }
          );

        }

        catch (error) {}

      }


      sendToSheets();


      /* ==========================================
         GA4
      ========================================== */

      if (
        typeof gtag ===
        "function"
      ) {

        gtag(
          "event",
          "click_instituto",
          {

            destination:
              "whatsapp_instituto",

            click_id:
              clickId,

            utm_source:
              tracking.utm_source,

            utm_medium:
              tracking.utm_medium,

            utm_campaign:
              tracking.utm_campaign,

            utm_content:
              tracking.utm_content

          }
        );

      }


      /* ==========================================
         WHATSAPP
      ========================================== */

      const message =
        "Olá! Gostaria de conhecer os cursos do Instituto Bulhões.";


      const whatsappURL =

        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(
          message
        );


      setTimeout(
        function () {

          window.location.replace(
            whatsappURL
          );

        },
        700
      );

    })();

  </script>

</body>

</html>
